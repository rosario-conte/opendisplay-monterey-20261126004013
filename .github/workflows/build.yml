name: Build OpenDisplay Monterey

on:
  push:
    branches: [monterey-build]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build Sender
        run: |
          xcodebuild \
            -project OpenSidecar.xcodeproj \
            -scheme OpenSidecarMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS=arm64 \
            MACOSX_DEPLOYMENT_TARGET=12.3 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package application
        run: |
          APP=$(find build/Build/Products \
            -name 'OpenDisplay.app' -type d | head -1)
          test -n "$APP"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" OpenDisplay-Monterey.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OpenDisplay-Monterey
          path: OpenDisplay-Monterey.zip
